<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KájovoCML NG section selector</title><style>:root{--ink:#18212d;--muted:#647181;--teal:#007f7a;--soft:#e8f6f5;--side:#111923}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;font:14px Montserrat,Inter,Arial,sans-serif;color:var(--ink)}.app{width:min(1100px,94vw);display:grid;grid-template-columns:minmax(520px,1fr) 320px;gap:32px;align-items:center}.stage{height:680px;position:relative;display:grid;place-items:center}.wheel{width:520px;height:520px;position:relative;transition:transform .18s ease}.core{position:absolute;left:182px;top:182px;width:156px;height:156px;border-radius:50%;background:var(--side);box-shadow:0 0 0 14px var(--soft),0 22px 60px #11192322;z-index:3;display:grid;place-items:center}.core:after{content:"K";color:#fff;font-size:72px;font-weight:700}.ring{position:absolute;left:173px;top:173px;width:174px;height:174px;border:4px solid var(--teal);border-radius:50%;z-index:4}.ray{position:absolute;left:260px;top:260px;width:195px;height:2px;background:#8ebdb9;transform-origin:0 50%;transition:height .14s,background .14s,box-shadow .14s}.ray:after{content:"";position:absolute;right:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:inherit}.ray.active{height:4px;background:var(--teal);box-shadow:0 0 0 4px #e8f6f580}.panel{background:white;border:1px solid #dfe4ea;border-radius:10px;padding:22px;box-shadow:0 14px 36px #18212d0d}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}.panel h1{font-size:24px;margin:8px 0}.panel p{color:var(--muted);line-height:1.55}.n{font:700 56px/1 Montserrat;color:#dfe4ea}.controls{display:flex;gap:8px;margin-top:18px}.controls button{border:1px solid #cfd6de;background:white;border-radius:6px;padding:10px 14px;font-weight:600;cursor:pointer}.controls button.primary{background:var(--teal);color:white;border-color:var(--teal)}.hint{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:880px){.app{grid-template-columns:1fr}.stage{height:560px;transform:scale(.82);margin:-45px}.panel{margin-top:-35px}}</style></head><body><main class="app"><section class="stage"><div class="wheel" id="wheel"><div class="ring"></div><div class="core"></div></div></section><aside class="panel"><div class="eyebrow">KájovoCML NG · 17 kanonických sekcí</div><div class="n" id="num">01</div><h1 id="name"></h1><p id="route"></p><div class="controls"><button id="prev">← Předchozí</button><button class="primary" id="next">Další →</button></div><div class="hint">Kolečko myši nebo šipky mění aktivní sekci. Pořadí vzniká přímo z UI registry.</div></aside></main><script>const sections=[{"title": "Centrální chat", "route": "/chat"}, {"title": "Dashboard", "route": "/dashboard"}, {"title": "Generování", "route": "/generation"}, {"title": "AI agenti", "route": "/agents"}, {"title": "MCP servery a nástroje", "route": "/mcp"}, {"title": "Browser relace a automatizace", "route": "/browser"}, {"title": "Registrované prvky", "route": "/registered"}, {"title": "Katalog komponent", "route": "/components"}, {"title": "Externí systémy", "route": "/external"}, {"title": "Monitoring", "route": "/monitoring"}, {"title": "API klíč a runtime vazby", "route": "/runtime-access"}, {"title": "Secrets a hesla", "route": "/secrets"}, {"title": "Audit a logy", "route": "/audit"}, {"title": "Konfigurace", "route": "/configuration"}, {"title": "Testy a API", "route": "/tests-api"}, {"title": "Bezpečnost", "route": "/security"}, {"title": "Releases a provoz", "route": "/releases"}];const wheel=document.getElementById('wheel'),nameEl=document.getElementById('name'),routeEl=document.getElementById('route'),numEl=document.getElementById('num');let active=0;sections.forEach((s,i)=>{const d=document.createElement('div');d.className='ray';d.style.transform=`rotate(${-90+i*360/sections.length}deg)`;d.dataset.i=i;d.onclick=()=>{active=i;render()};wheel.appendChild(d)});function render(){document.querySelectorAll('.ray').forEach((x,i)=>x.classList.toggle('active',i===active));wheel.style.transform=`rotate(${-active*360/sections.length}deg)`;numEl.textContent=String(active+1).padStart(2,'0');nameEl.textContent=sections[active].title;routeEl.textContent=sections[active].route}function move(d){active=(active+d+sections.length)%sections.length;render()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});addEventListener('wheel',e=>{e.preventDefault();move(e.deltaY>0?1:-1)},{passive:false});render();</script></body></html>
