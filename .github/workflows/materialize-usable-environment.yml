name: Materialize usable environment

on:
  push:
    branches: [main]
    paths:
      - scripts/materialize_usable_environment.py
      - .github/workflows/materialize-usable-environment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize implementation
        run: python scripts/materialize_usable_environment.py
      - name: Install and test implementation
        run: |
          python -m pip install -e './implementation[all]'
          python -m unittest discover -s implementation/tests -v
          kajovo-factory selftest
      - name: Clean generated local state
        run: rm -rf implementation/src/kajovo_factory.egg-info .kajovo-selftest .kajovo
      - name: Refresh package inventory
        run: python scripts/update_manifests.py
      - name: Commit implementation and inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             implementation/README.md             implementation/pyproject.toml             implementation/examples/agent.json             implementation/examples/mcp-calculator.json             implementation/src/kajovo_factory/__init__.py             implementation/src/kajovo_factory/cli.py             implementation/tests/test_factory.py             PACKAGE_MANIFEST.json FILE_MANIFEST_SHA256 FILE_MANIFEST_SHA256.json
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize usable Kájovo Factory implementation'
            git pull --rebase origin main
            git push origin main
          fi
