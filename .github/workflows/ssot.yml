name: SSOT validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python scripts/verify_package.py
  freeze-gate:
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python scripts/verify_package.py --freeze
