name: SSOT validation
on:
  push:
    branches: [main, ssot-repair-2026-09-30]
  workflow_dispatch:
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-audit.txt
      - run: python scripts/verify_package.py
  freeze-gate:
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-audit.txt
      - run: python scripts/verify_package.py --freeze
