name: Implementation smoke

on:
  push:
    branches: [main]
    paths:
      - implementation/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install implementation
        run: python -m pip install -e './implementation[all]'
      - name: Test implementation
        run: |
          python -m unittest discover -s implementation/tests -v
          kajovo-factory selftest
      - name: Clean generated local state
        run: rm -rf implementation/src/kajovo_factory.egg-info .kajovo-selftest .kajovo
      - name: Refresh package inventory
        run: python scripts/update_manifests.py
      - name: Commit refreshed inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PACKAGE_MANIFEST.json FILE_MANIFEST_SHA256 FILE_MANIFEST_SHA256.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh package inventory after implementation smoke'
            git pull --rebase origin main
            git push origin main
          fi
