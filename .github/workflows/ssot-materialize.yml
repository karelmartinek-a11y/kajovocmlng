name: Materialize verified SSOT package
on:
  push:
    branches: [main]
    paths:
      - '.ssot-materialization/**'
      - '.github/workflows/ssot-materialize.yml'
permissions:
  contents: write
concurrency:
  group: ssot-materialization-main
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bundle and apply exact patch
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, json, hashlib, gzip, subprocess, tempfile
          root=pathlib.Path('.ssot-materialization')
          meta=json.loads((root/'metadata.json').read_text())
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          if parent != meta['baseCommit']:
              raise SystemExit('Base changed; refusing to overwrite concurrent work')
          parts=[]
          for part in meta['parts']:
              raw=(root/part['name']).read_bytes()
              if len(raw)!=part['bytes'] or hashlib.sha256(raw).hexdigest()!=part['sha256']:
                  raise SystemExit('Bundle part integrity failure')
              parts.append(raw)
          compressed=b''.join(parts)
          if len(compressed)!=meta['compressedBytes'] or hashlib.sha256(compressed).hexdigest()!=meta['compressedSha256']:
              raise SystemExit('Compressed bundle integrity failure')
          patch=gzip.decompress(compressed)
          if len(patch)!=meta['patchBytes'] or hashlib.sha256(patch).hexdigest()!=meta['patchSha256']:
              raise SystemExit('Patch integrity failure')
          with tempfile.NamedTemporaryFile() as f:
              f.write(patch);f.flush()
              subprocess.run(['git','apply','--check','--index',f.name],check=True)
              subprocess.run(['git','apply','--index',f.name],check=True)
          subprocess.run(['git','rm','-r','--','.ssot-materialization','.github/workflows/ssot-materialize.yml'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          if tree != meta['targetTree']:
              raise SystemExit('Resulting tree differs from locally verified tree')
          PY
      - name: Validate the exact result
        run: |
          python -m pip install jsonschema==4.25.1
          python scripts/verify_package.py
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare SSOT contracts, responsive UI references and forensic freeze gate"
          git push origin HEAD:main
